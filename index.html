<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bienvenido</title>
<meta name="theme-color" content="#0f1012">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0f1012; --card:#18191c; --card2:#1f2024; --line:#2a2b30;
    --text:#f3f3f1; --muted:#9a9ba1; --accent:#E8B04A; --ok:#25D366;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
       min-height:100vh;-webkit-font-smoothing:antialiased;padding:0 16px 40px}
  .wrap{max-width:440px;margin:0 auto}
  header{text-align:center;padding:36px 0 22px}
  .logo{width:76px;height:76px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;
        background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
        color:#111;font-weight:800;font-size:28px;letter-spacing:.5px;overflow:hidden;
        box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 25%,transparent)}
  .logo img{width:100%;height:100%;object-fit:cover}
  h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
  .slogan{color:var(--muted);font-size:13.5px;margin-top:6px}
  .mesa{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 14px;border-radius:999px;
        background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted)}
  .mesa b{color:var(--text);font-size:15px;letter-spacing:.5px}
  .mesa .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
  .card h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;
           display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .card h2 svg{width:16px;height:16px;stroke:var(--accent)}

  /* WiFi */
  .wifi-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;
            background:var(--card2);border-radius:14px;margin-bottom:8px}
  .wifi-row small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:3px}
  .wifi-row span{font-weight:600;font-size:15.5px;word-break:break-all}
  .btn-sm{flex:none;border:0;border-radius:10px;padding:9px 13px;font:600 13px Inter,sans-serif;cursor:pointer;
          background:var(--accent);color:#141414;transition:transform .1s}
  .btn-sm:active{transform:scale(.96)}
  .btn-sm.done{background:var(--ok);color:#fff}
  .link{background:none;border:0;color:var(--muted);font:500 13px Inter,sans-serif;text-decoration:underline;
        text-underline-offset:3px;cursor:pointer;margin-top:6px;padding:4px 0}
  .wifiqr{display:none;text-align:center;padding-top:12px}
  .wifiqr.show{display:block}
  .wifiqr .q{display:inline-block;background:#fff;padding:12px;border-radius:14px}
  .wifiqr p{color:var(--muted);font-size:12.5px;margin-top:10px;line-height:1.45}

  /* Botones grandes */
  .big{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--line);
       background:var(--card);color:var(--text);text-decoration:none;margin-top:12px;cursor:pointer;font:inherit;text-align:left}
  .big .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
  .big .ic svg{width:22px;height:22px}
  .big b{display:block;font-size:16px;font-weight:700}
  .big small{color:var(--muted);font-size:12.5px}
  .big .arr{margin-left:auto;color:var(--muted);font-size:20px}
  .big.wa{background:linear-gradient(135deg,#1f9e51,#128c4a);border-color:transparent}
  .big.wa .ic{background:rgba(255,255,255,.18)} .big.wa small{color:rgba(255,255,255,.85)} .big.wa .arr{color:#fff}
  .big.menu .ic{background:color-mix(in srgb,var(--accent) 18%,transparent)} .big.menu .ic svg{stroke:var(--accent)}

  /* Redes */
  .redes{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
  .red{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;border-radius:14px;
       background:var(--card2);color:var(--text);text-decoration:none;font-size:12.5px;font-weight:600}
  .red svg{width:22px;height:22px;stroke:var(--accent)}

  /* Info */
  .info li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .info li:last-child{border-bottom:0}
  .info svg{width:17px;height:17px;stroke:var(--muted);flex:none;margin-top:1px}
  .info a{color:var(--text);text-decoration:none}

  footer{text-align:center;color:#5d5e64;font-size:11.5px;margin-top:28px}

  /* Menú (hoja) */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
  .sheet.show{display:flex}
  .panel{background:var(--bg);width:100%;max-width:520px;margin:0 auto;max-height:88vh;overflow:auto;
         border-radius:24px 24px 0 0;border:1px solid var(--line);padding:8px 18px 30px;animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 14px}
  .panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .panel-h h3{font-size:20px;font-weight:800}
  .x{background:var(--card);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
  .cat{color:var(--accent);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin:20px 0 6px}
  .item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .item b{font-size:15px;font-weight:600} .item small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .item .p{font-weight:700;white-space:nowrap;font-size:14px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:#fff;color:#111;
         padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo"></div>
    <h1 id="negocio"></h1>
    <p class="slogan" id="eslogan"></p>
    <div class="mesa" id="mesaTag" hidden><span class="dot"></span>Mesa <b id="mesaNum"></b></div>
  </header>

  <!-- WiFi -->
  <section class="card" id="wifiCard">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8" fill="currentColor"/></svg>WiFi gratis</h2>
    <div class="wifi-row"><div><small>Red</small><span id="wRed"></span></div></div>
    <div class="wifi-row" id="wClaveRow"><div><small>Contraseña</small><span id="wClave"></span></div>
      <button class="btn-sm" id="copyBtn">Copiar</button></div>
    <button class="link" id="qrToggle">Compartir WiFi con alguien de la mesa</button>
    <div class="wifiqr" id="wifiQr"><div class="q" id="qrBox"></div>
      <p>Pídele a tu acompañante que escanee este código con la cámara<br>y se conectará automáticamente.</p></div>
  </section>

  <!-- Menú -->
  <a class="big menu" id="menuBtn">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>
    <span><b id="menuLabel">Ver menú</b><small id="menuSub">Platillos, bebidas y precios</small></span><span class="arr">›</span>
  </a>

  <!-- WhatsApp -->
  <a class="big wa" id="waBtn" target="_blank" rel="noopener">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.3A8.5 8.5 0 1 1 21 11.5z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5"/></svg></span>
    <span><b>Pedir por WhatsApp</b><small id="waSub">Te atendemos al instante</small></span><span class="arr">›</span>
  </a>

  <!-- Redes -->
  <section class="card" id="redesCard">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Síguenos</h2>
    <div class="redes" id="redes"></div>
  </section>

  <!-- Info -->
  <section class="card" id="infoCard">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>Información</h2>
    <ul class="info" id="info"></ul>
  </section>

  <footer id="creditos"></footer>
</div>

<!-- Hoja del menú -->
<div class="sheet" id="sheet">
  <div class="panel">
    <div class="grab"></div>
    <div class="panel-h"><h3 id="menuTitulo"></h3><button class="x" id="closeMenu" aria-label="Cerrar">✕</button></div>
    <div id="menuList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const C = window.CONFIG || {};
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = msg => { const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); };

  if (C.colorAcento) document.documentElement.style.setProperty("--accent", C.colorAcento);
  document.title = C.negocio || "Bienvenido";

  // Mesa desde el link (?mesa=07)
  const mesa = (new URLSearchParams(location.search).get("mesa") || "").replace(/[^\w-]/g,"").slice(0,6);
  if (mesa) { $("mesaTag").hidden = false; $("mesaNum").textContent = mesa; }

  // Encabezado
  $("logo").innerHTML = C.logo ? `<img src="${esc(C.logo)}" alt="">` : esc(C.iniciales || (C.negocio||"").slice(0,2));
  $("negocio").textContent = C.negocio || "";
  $("eslogan").textContent = C.eslogan || "";

  // WiFi
  const w = C.wifi || {};
  if (!w.red) $("wifiCard").hidden = true;
  $("wRed").textContent = w.red || "";
  if (!w.clave || w.seguridad === "nopass") $("wClaveRow").hidden = true;
  $("wClave").textContent = w.clave || "";
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(w.clave); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=w.clave; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    const b=$("copyBtn"); b.textContent="¡Copiada!"; b.classList.add("done");
    toast("Contraseña copiada. Pégala al conectarte a " + w.red);
    setTimeout(()=>{ b.textContent="Copiar"; b.classList.remove("done"); },2500);
  };
  let qrMade=false;
  $("qrToggle").onclick = () => {
    const box=$("wifiQr"); box.classList.toggle("show");
    if (!qrMade && window.QRCode) {
      const e = s => String(s||"").replace(/([\\;,:"])/g,"\\$1");
      const sec = w.seguridad || "WPA";
      new QRCode($("qrBox"), { text:`WIFI:T:${sec};S:${e(w.red)};P:${sec==="nopass"?"":e(w.clave)};;`, width:180, height:180, correctLevel: QRCode.CorrectLevel.M });
      qrMade=true;
    }
  };

  // Menú
  $("menuLabel").textContent = "Ver " + (C.menuLink ? "menú" : (C.menuTitulo || "menú")).toLowerCase();
  if (C.menuSubtitulo) $("menuSub").textContent = C.menuSubtitulo;
  if (C.menuLink) { $("menuBtn").href = C.menuLink; $("menuBtn").target="_blank"; }
  else if (C.menu && C.menu.length) {
    $("menuTitulo").textContent = C.menuTitulo || "Menú";
    $("menuList").innerHTML = C.menu.map(cat =>
      `<div class="cat">${esc(cat.categoria)}</div>` +
      (cat.items||[]).map(i => `<div class="item"><div><b>${esc(i.nombre)}</b>${i.detalle?`<small>${esc(i.detalle)}</small>`:""}</div><div class="p">${esc(i.precio)}</div></div>`).join("")
    ).join("");
    $("menuBtn").onclick = () => $("sheet").classList.add("show");
  } else $("menuBtn").hidden = true;
  $("closeMenu").onclick = () => $("sheet").classList.remove("show");
  $("sheet").onclick = ev => { if (ev.target.id==="sheet") $("sheet").classList.remove("show"); };

  // WhatsApp
  const wa = C.whatsapp || {};
  if (wa.numero) {
    const msg = (wa.mensaje || "").replace(/\{mesa\}/g, mesa || "—").replace(/ en la mesa —/," ");
    $("waBtn").href = `https://wa.me/${wa.numero.replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`;
    if (mesa) $("waSub").textContent = `Tu mensaje ya incluye la mesa ${mesa}`;
  } else $("waBtn").hidden = true;

  // Redes
  const icons = {
    instagram:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>',
    facebook:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V21M6 10h8"/></svg>',
    tiktok:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.5 2.5 2.5 4.5 5 4.5"/></svg>',
    web:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>'
  };
  const names = {instagram:"Instagram",facebook:"Facebook",tiktok:"TikTok",web:"Sitio web"};
  const redes = Object.entries(C.redes||{}).filter(([k,v])=>v);
  if (!redes.length) $("redesCard").hidden = true;
  $("redes").innerHTML = redes.map(([k,v]) => `<a class="red" href="${esc(v)}" target="_blank" rel="noopener">${icons[k]||icons.web}${names[k]||esc(k)}</a>`).join("");

  // Info
  const I = {
    tel:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
  };
  const rows = [];
  if (C.horario)   rows.push(`<li>${I.clock}<span>${esc(C.horario)}</span></li>`);
  if (C.direccion) rows.push(`<li>${I.pin}${C.mapa?`<a href="${esc(C.mapa)}" target="_blank" rel="noopener">${esc(C.direccion)} ›</a>`:`<span>${esc(C.direccion)}</span>`}</li>`);
  if (C.telefono)  rows.push(`<li>${I.tel}<a href="tel:${esc(C.telefono.replace(/[^\d+]/g,""))}">${esc(C.telefono)}</a></li>`);
  if (C.correo)    rows.push(`<li>${I.mail}<a href="mailto:${esc(C.correo)}">${esc(C.correo)}</a></li>`);
  if (!rows.length) $("infoCard").hidden = true;
  $("info").innerHTML = rows.join("");

  $("creditos").textContent = C.creditos || "";
})();
</script>
</body>
</html>
